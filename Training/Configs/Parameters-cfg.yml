log:
    level: INFO
    format: "%(asctime)s | %(levelname)s | %(message)s"
    mode: both
    colored_console: True
    # Note: The name and path of the log file are set in the settings section for each code.
    filepath: "{path.model}" # Set in the subset config.
    filename_prefix: mk_dataset
    filename: "{project.name}_{timestamp}" # if set to "now", the current date set as the logfile name.
    filename_timestamp: null

dataset:
    data_format:
        dimension_order: CW
        component_order: ZNE
        sampling_rate: 100
        measurement: velocity
        unit: counts
        instrument_response: not restituted
    split_ratios:
        train: 0.8
        dev: 0.1
        test: 0.1

dataloader:
    train:
        batch_size: 256
        shuffle: true
        num_workers: 0
    dev:
        batch_size: 256
        shuffle: false
        num_workers: 0
    test:
        batch_size: 256
        shuffle: false
        num_workers: 0

augmentation:
    srsb.waveform.Tapering: {}
    
    sbg.Normalize:
        demean_axis: -1
        amp_norm_axis: -1
        amp_norm_type: peak

    sbg.FixedWindow:
        p0: -1500          # -15 * sps
        windowlen: 6000    # 60 * sps
        strategy: pad
        key: X

    sbg.WindowAroundSample:
        metadata_keys: null
        samples_before: 2000
        windowlen: 5000
        selection: random
        strategy: variable

    sbg.GaussianNoise:
        scale: [0.0, 0.02]
        key: X

    sbg.RandomWindow:
        windowlen: 3001

    sbg.ChangeDtype:
        dtype: np.float32

    sbg.ProbabilisticLabeller:
        label_columns: null
        model_labels: NPS
        sigma: 30
        dim: 0

preprocess:
    trim:
        before: 5
        after: 25

model:
    name: PhaseNet
    version_str: '{timestamp}'
    hyperparameters:
        norm: peak
        phases: 'NPS'

path:
    dataset: 'C:\Users\ikahbasi\Documents\DataSets-Local\1405-04-03\Merged_Dataset_2026-06-24T15-15-22'
    model: 'D:\Models\{model.name}_{timestamp}'

train:
    hyperparameters:
        learning_rates:
            - 1.0e-2
        epochs_for_each_learning_rate:
            - 1
        manual_seed: 42

        lr_scheduler:
            ReduceLROnPlateau:
                mode: min
                factor: 0.2
                patience: 3
                threshold: 1.0e-4
                threshold_mode: rel
                cooldown: 0
                min_lr: 0
                eps: 1.0e-08
